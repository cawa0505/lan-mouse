name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev libx11-dev libxtst-dev

      - name: Build release binary (baseline x86-64, avoids -march=native AVX SIGILL on old CPUs)
        env:
          RUSTFLAGS: "-C target-cpu=x86-64"
          CFLAGS: "-O2 -march=x86-64 -mtune=generic"
          CXXFLAGS: "-O2 -march=x86-64 -mtune=generic"
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/lan-mouse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-mouse-x86_64
          path: target/release/lan-mouse

      - name: Attach release asset (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/lan-mouse#lan-mouse-x86_64 \
            --title "$GITHUB_REF_NAME" \
            --notes "baseline x86-64 release build"
